[project]
name = "portfolio-backend"
version = "0.1.0"
description = "AI-adaptive portfolio backend"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
    "openai>=2.0",
    "python-dotenv>=1.0",
    "pydantic-ai>=1.86.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.11",
    "deepeval>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["eval: LLM evaluation test (slow, hits real API)"]
addopts = "-m 'not eval'"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
